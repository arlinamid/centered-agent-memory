name: Release

# A tag is a promise that the thing behind it works. So the tarball attached
# to the release is not built and hoped for: it is installed on all three
# platforms first, and the release only appears if all three came up.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Which tag (e.g. v0.5.0)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Same as in CI: the native dependency ships a prebuild, no compiler is
      # needed, and skipping the install scripts takes advantage of that.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test
      - run: node .github/scripts/check-privacy.mjs

      - name: Pack and install globally
        shell: bash
        run: |
          npm pack
          npm install -g --ignore-scripts ./centered-agent-memory-*.tgz

      - name: Installed copy starts and answers
        shell: bash
        run: |
          out=$(cam status)
          test -n "$out" || { echo "installed cam printed nothing"; exit 1; }
          cam doctor
          node .github/scripts/mcp-initialize.mjs

  release:
    name: release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      # A tag claiming a version the package does not carry would produce a
      # tarball that installs as something else. Cheap to check, confusing to
      # debug later.
      - name: Tag matches package.json version
        id: meta
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "v$version" || {
            echo "tag ($tag) does not match package.json version ($version)"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # `npm pack` already produces `<name>-<version>.tgz`, which is exactly
      # what the release notes link to — no rename needed, and none allowed.
      - name: Build the package
        shell: bash
        run: npm pack

      - name: Release notes from the changelog
        shell: bash
        run: |
          node .github/scripts/release-notes.mjs \
            "${{ steps.meta.outputs.version }}" \
            "${{ github.repository }}" \
            "${{ steps.meta.outputs.tag }}" > notes.md
          cat notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file notes.md \
            "centered-agent-memory-${{ steps.meta.outputs.version }}.tgz"
